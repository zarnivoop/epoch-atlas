*{margin:0;padding:0;box-sizing:border-box}
body{background:#06060b;color:#c8c0a8;font-family:'Inter',sans-serif;overflow:hidden;height:100vh;user-select:none}
#app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:1fr 72px;height:100vh;width:100vw}

#mc{position:relative;background:#040408;overflow:hidden}
#ms{width:100%;height:100%;display:block}

.eq{fill:none;stroke:rgba(200,192,160,0.03);stroke-width:0.4;stroke-dasharray:4,6}
.grat{fill:none;stroke:rgba(200,192,160,0.012);stroke-width:0.3}
.cd{fill:#e8d8a0;stroke:rgba(0,0,0,0.4);stroke-width:0.4}
.cl{fill:rgba(232,216,160,0.5);font-family:'Cormorant Garamond',serif;font-size:7px;font-style:italic;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,0.8)}
.mb{position:absolute;top:12px;left:12px;display:flex;gap:2px}
.mb button{font-size:9px;padding:4px 12px;border-radius:2px;border:1px solid rgba(200,192,160,0.06);background:rgba(6,6,10,0.7);color:rgba(200,192,160,0.35);cursor:pointer;transition:all 0.15s;text-transform:uppercase;letter-spacing:0.08em;backdrop-filter:blur(4px)}
.mb button:hover{color:rgba(200,192,160,0.6);border-color:rgba(200,192,160,0.12)}
.mb button.on{color:#d4b870;border-color:rgba(212,184,112,0.2);background:rgba(212,184,112,0.06)}
#sel-info{position:absolute;top:48px;left:12px;display:none;font-size:11px;font-family:'Cormorant Garamond',serif;color:#d4b870;background:rgba(6,6,10,0.75);padding:4px 12px;border-radius:2px;backdrop-filter:blur(4px);border:1px solid rgba(212,184,112,0.1)}

#eh{padding:14px 16px 8px;border-bottom:1px solid rgba(200,192,160,0.04);flex-shrink:0}

#eh .sub{font-size:8px;color:rgba(200,192,160,0.18);text-transform:uppercase;letter-spacing:0.12em;margin-top:1px}
#filter-bar{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
#filter-bar .fb{font-size:7px;padding:2px 7px;border-radius:2px;border:1px solid rgba(200,192,160,0.05);background:transparent;color:rgba(200,192,160,0.25);cursor:pointer;transition:all 0.15s;text-transform:uppercase;letter-spacing:0.06em}

#filter-bar .fb.on{color:#d4b870;border-color:rgba(212,184,112,0.18);background:rgba(212,184,112,0.05)}
#el{flex:1;overflow-y:auto;padding:2px 0}

#el::-webkit-scrollbar-thumb{background:rgba(200,192,160,0.04);border-radius:2px}
.ev{padding:7px 16px;border-left:2px solid transparent;transition:all 0.2s;cursor:pointer}

.ev.on{border-left-color:#d4b870;background:rgba(212,184,112,0.025)}
.ev .ey{font-family:'Cormorant Garamond',serif;font-size:12px;font-weight:700;color:#d4b870;margin-bottom:1px}
.ev .et{font-size:11px;font-weight:500;color:#e8dfc0;line-height:1.3}

.ev.on .ed{display:block}

.pb{flex:1;height:2px;background:rgba(200,192,160,0.03);border-radius:1px;margin:0 6px}
.pf{height:100%;background:rgba(212,184,112,0.22);border-radius:1px;transition:width 0.3s}
.if{font-size:9px;color:rgba(200,192,160,0.12);min-width:55px;text-align:right;font-feature-settings:"tnum"}

gG.append('path').datum({type:'LineString',coordinates:[[-180,0],[180,0]]}).attr('class','eq').attr('d',pf);

const zoom=d3.zoom().scaleExtent([1,8]).translateExtent([[-W*2,-H*2],[W*2,H*2]])
  .on('zoom',e=>{gL.attr('transform',e.transform);gC.attr('transform',e.transform);gR.attr('transform',e.transform);gM.attr('transform',e.transform);gX.attr('transform',e.transform)});
svg.call(zoom);

// Load 50m land for terrain basemap
d3.json('https://unpkg.com/world-atlas@2.0.2/land-50m.json').then(d=>{
  countryData = topojson.feature(d, d.objects.land);
  gL.selectAll('path').data(countryData.features).join('path').attr('d',pf)
    .attr('fill','#1a1a28').attr('stroke','none');
  loadHistorical();
}).catch(()=>{
  // Fallback: just load historical directly
  loadHistorical();
});

// Load historical GeoJSON (world_1492 covers 1453-1492)
function loadHistorical(){
  const url = 'https://raw.githubusercontent.com/aourednik/historical-basemaps/master/geojson/world_1492.geojson';
  d3.json(url).then(data=>{
    histFeatures = data.features;
    drawHistorical();
    go(0);
  }).catch(e=>{
    console.error('Failed to load historical data:', e);
  });
}

function drawHistorical(){
  // Remove old historical features
  gC.selectAll('*').remove();

  gC.selectAll('path').data(histFeatures).join('path').attr('d',pf)
    .attr('class','land')
    .attr('fill',d=>getFill(d))
    .attr('stroke',d=>getStroke(d))
    .on('click',(event,d)=>onClick(d));

  // Labels
  const centroids = {};
  histFeatures.forEach(d=>{
    try{const c=d3.geoPath().projection(proj).centroid(d);if(c&&isFinite(c[0])&&isFinite(c[1]))centroids[d.properties.NAME||'x']=c;}catch(e){}
  });

  // Get unique faction territories, label by faction centroid
  const factionCentroids = {};
  histFeatures.forEach(d=>{
    const p = d.properties;
    const name = p.SUBJECTO || p.NAME;
    const fid = ENT[name];
    if(!fid||fid==='neutral')return;
    if(!factionCentroids[fid])factionCentroids[fid]={count:0,cx:0,cy:0,name:(F[fid]||{}).n||name};
    if(centroids[p.NAME]){
      factionCentroids[fid].count++;
      factionCentroids[fid].cx+=centroids[p.NAME][0];
      factionCentroids[fid].cy+=centroids[p.NAME][1];
    }
  });

  Object.entries(factionCentroids).forEach(([fid,fc])=>{
    if(fc.count<1)return;
    const x=fc.cx/fc.count, y=fc.cy/fc.count;
    const txt = fc.name;
    const tw = txt.length*7+8;
    gC.append('rect').attr('class','clabel-bg').attr('x',x-tw/2-2).attr('y',y-9).attr('width',tw+4).attr('height',18);
    gC.append('text').attr('class','clabel').attr('x',x).attr('y',y+4).text(txt);
  });

  // Cities
  CITIES.forEach(c=>{
    const p=proj([c.lo,c.la]);if(!p)return;
    const r = Math.max(1, Math.sqrt(c.pop/300));
    gC.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',r).attr('class','cd');
    if(c.pop>50000){
      gC.append('text').attr('x',p[0]+r+3).attr('y',p[1]+1).attr('class','cl').text(c.n);
    }
  });

  // Continent labels
  [{n:'EUROPE',c:[15,50]},{n:'ASIA',c:[90,40]},{n:'AFRICA',c:[20,5]},{n:'AMERICA',c:[-85,15]}]
    .forEach(l=>{const p=proj(l.c);if(p)gX.append('text').attr('fill','rgba(200,192,160,0.03)').attr('font-family','Cormorant Garamond,serif').attr('font-size',13).attr('font-style','italic').attr('letter-spacing','0.3em').attr('text-anchor','middle').attr('dominant-baseline','middle').attr('pointer-events','none').text(l.n).attr('x',p[0]).attr('y',p[1])});
}

// ======================================================================
//  FILL / STROKE LOGIC
// ======================================================================
function getFaction(d){
  const p = d.properties;
  const name = p.SUBJECTO || p.NAME;
  return ENT[name] || 'neutral';
}

function getFill(d){
  const fid = getFaction(d);
  const yr = yrs[curIdx];
  
  // Handle Spanish conquests by year
  if(fid==='aztec' && yr>=1521) return F.spain.c;
  if(fid==='inca' && yr>=1533) return F.spain.c;
  if(fid==='mamluk' && yr>=1517) return F.ottoman.c;
  if(fid==='hungary' && yr>=1526) return F.ottoman.c;
  
  if(mapMode==='population'){
    // Population mode: dark = unpopulated, bright = populated
    // Use a base color and add city glow
    return '#1e1e2e';
  }
  if(mapMode==='religion'){
    const r = REL[fid] || 'animist';
    return REL_COLORS[r] || '#3a3a48';
  }
  // Political mode
  if(fid==='neutral'||!F[fid]) return '#2a2a36';
  return F[fid].c;
}

function getStroke(d){
  const fid=getFaction(d);
  if(mapMode!=='political') return 'rgba(0,0,0,0.15)';
  if(selectedCode===fid) return '#e0c060';
  if(fid==='neutral'||!F[fid]) return 'rgba(0,0,0,0.1)';
  return F[fid].b;
}

function onClick(d){
  const fid=getFaction(d);
  if(selectedCode===fid){selectedCode=null;document.getElementById('sel-info').classList.remove('show')}
  else{selectedCode=fid;
    document.getElementById('sel-info').textContent=`📍 ${(F[fid]||{}).n||'Territory'}`;
    document.getElementById('sel-info').classList.add('show');}
  gC.selectAll('.land').attr('stroke',dd=>getStroke(dd));
  renderEvents();
}

// ======================================================================
//  YEAR UPDATE
// ======================================================================
function go(i){
  if(i<0||i>=yrs.length)return;
  curIdx=i;const yr=yrs[i];

  // Update fills for year-sensitive conquests
  gC.selectAll('.land').transition().duration(300).ease(d3.easeQuadInOut)
    .attr('fill',d=>getFill(d))
    .attr('stroke',d=>getStroke(d));

  document.getElementById('yt').textContent=yr;
  document.getElementById('era').textContent=era(yr);
  document.getElementById('pf').style.width=((i+1)/yrs.length*100)+'%';

  const ye=evByY[yr]||[];
  let ae=0;Object.keys(evByY).forEach(k=>{if(parseInt(k)<=yr)ae+=evByY[k].length});
  document.getElementById('ec').textContent=ae;

  // Event markers
  gM.selectAll('*').remove();
  ye.forEach(ev=>{
    const p=proj([ev.lo,ev.la]);if(!p)return;
    const col=clr(ev.p);
    const g=gM.append('g').attr('transform',`translate(${p[0]},${p[1]})`);
    if(ev.i===1){
      g.append('circle').attr('r',3).attr('fill','none').attr('stroke',col).attr('stroke-width',1).style('opacity',0.4)
        .transition().duration(2000).ease(d3.easeQuadOut).attr('r',16).style('opacity',0).remove();
    }
    g.append('circle').attr('r',ev.i===1?3:2).attr('fill',col).attr('stroke','rgba(255,255,255,0.3)').attr('stroke-width',0.3);
    if(ev.i===1){
      const lw=ev.t.length*5+10;
      g.append('rect').attr('x',-lw/2).attr('y',-17).attr('width',lw).attr('height',12).attr('rx',2).attr('fill','rgba(6,6,10,0.85)').attr('stroke',col).attr('stroke-width',0.3);
      g.append('text').attr('x',0).attr('y',-9).attr('text-anchor','middle').attr('fill','#e8dfc0').attr('font-size',8).attr('font-family','Inter').attr('font-weight',500).text(ev.t);
    }
  });

  renderEvents();
}

// ======================================================================
//  RENDER EVENTS
// ======================================================================
function renderEvents(){
  const el=document.getElementById('el');el.innerHTML='';
  const yr=yrs[curIdx];
  const ye=evByY[yr]||[];
  const visible=EV.filter(e=>e.y<=yr).reverse();
  visible.forEach(ev=>{
    const show=filters.all||(filters.major&&ev.i===1)||filters[ev.p];
    if(!show)return;
    if(selectedCode){
      const ef=getFaction({properties:{SUBJECTO:null,NAME:null}}); // Can't map event to faction directly
      // Skip country filter for now
    }
    const active=ye.includes(ev);
    const d=document.createElement('div');
    const col=clr(ev.p);
    d.className=`ev ${active?'on':''}`;
    d.innerHTML=`<div class="ey">${ev.y}</div><div class="et">${ev.t}</div><div class="ed">${ev.d}</div><span class="mt" style="background:${col}18;color:${col}">${ev.p.toUpperCase()}</span>`;
    if(active)setTimeout(()=>d.scrollIntoView({behavior:'smooth',block:'center'}),150);
    el.appendChild(d);
  });
}

// ======================================================================
//  CONTROLS
// ======================================================================
function nav(i){if(i>=0&&i<yrs.length){stop();go(i)}}
document.getElementById('b0').onclick=()=>nav(0);
document.getElementById('b1').onclick=()=>nav(curIdx-1);
document.getElementById('b2').onclick=()=>nav(curIdx+1);
document.getElementById('b3').onclick=()=>nav(yrs.length-1);
document.getElementById('bp').onclick=()=>playing?stop():start();
function start(){
  if(curIdx>=yrs.length-1)go(0);
  playing=true;document.getElementById('bp').textContent='■';document.getElementById('bp').classList.add('on');
  pi=setInterval(()=>{if(curIdx<yrs.length-1)go(curIdx+1);else stop();},Math.max(300,1800/spd));
}
function stop(){
  playing=false;if(pi){clearInterval(pi);pi=null}
  document.getElementById('bp').textContent='▶';document.getElementById('bp').classList.remove('on');
}
document.querySelectorAll('[data-sp]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('[data-sp]').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');spd=parseInt(b.dataset.sp);
    if(playing){stop();start();}
  }
});
document.querySelectorAll('[data-mode]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');mapMode=b.dataset.mode;
    gC.selectAll('.land').attr('fill',d=>getFill(d)).attr('stroke',d=>getStroke(d));
  }
});
document.querySelectorAll('[data-f]').forEach(b=>{
  b.onclick=()=>{
    filters[b.dataset.f]=!filters[b.dataset.f];b.classList.toggle('on');renderEvents();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){e.preventDefault();nav(curIdx+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();nav(curIdx-1)}
  else if(e.key===' '){e.preventDefault();document.getElementById('bp').click()}
});
</script>
